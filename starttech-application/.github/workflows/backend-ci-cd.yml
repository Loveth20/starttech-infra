name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Run backend tests
        run: |
          cd backend
          go test ./...

      - name: Build Docker image
        run: |
          docker build -t starttech-backend:latest backend

      - name: Workflow sanity check
        run: echo "Backend CI pipeline ran successfully"

