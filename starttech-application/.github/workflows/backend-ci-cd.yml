name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPO: <your-ecr-repo-or-dockerhub>
      IMAGE_TAG: latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup Go
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      # 3️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t $ECR_REPO:$IMAGE_TAG ./backend

      # 4️⃣ Login to Docker Hub or ECR
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}    # Docker Hub username
          password: ${{ secrets.DOCKER_PASSWORD }}    # Docker Hub password

      # 5️⃣ Push Docker image
      - name: Push Docker image
        run: |
          docker push $ECR_REPO:$IMAGE_TAG

      # 6️⃣ Deploy to EC2 via SSM
      - name: Deploy backend via SSM
        uses: aws-actions/aws-ssm-run-command@v1
        with:
          targets: "Key=tag:Name,Values=starttech-backend"
          document-name: "AWS-RunShellScript"
          region: ${{ env.AWS_REGION }}
          parameters: |
            commands=[
              "docker rm -f golang-backend || true",
              "docker pull $ECR_REPO:$IMAGE_TAG",
              "docker run -d --name golang-backend -p 80:8080 $ECR_REPO:$IMAGE_TAG"
            ]
